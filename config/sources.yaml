# Źródła promocji dla Blackera.
# adapter: pepper | xkom-hotshot | morele-daily | komputronik | empik | jsonld | shopify | woocommerce
# tier:    aggregator | big | small   (filtr na dashboardzie)
# Nowy mały sklep na Shopify/WooCommerce = jeden wpis z url sklepu.

settings:
  # Minimalny wynik (0-100), żeby oferta trafiła do tabeli deali.
  minScoreToStore: 35
  # Od tego wyniku deal idzie do oceny AI.
  aiThreshold: 60
  # Bezpiecznik kosztów: maks. ocen AI na dobę.
  aiDailyLimit: 300
  aiBatchSize: 20
  # Odstęp między zapytaniami do tej samej domeny.
  requestDelayMs: 3000

sources:
  # --- Agregatory ---
  - id: pepper-hot
    name: Pepper.pl
    adapter: pepper
    tier: aggregator
    urls:
      - https://www.pepper.pl/rss/gor%C4%85ce
      - https://www.pepper.pl/rss/wszystkie

  # --- Duże sklepy ---
  - id: xkom-hotshot
    name: x-kom
    adapter: xkom-hotshot
    tier: big
    url: https://www.x-kom.pl/goracy_strzal

  # al.to zwraca 403 dla bota (sprawdzone 20.10.2026), dlatego jest wyłączony.
  - id: alto-hotshot
    name: al.to
    adapter: xkom-hotshot
    tier: big
    enabled: false
    url: https://www.al.to/goracy_strzal

  # x-kom wpuszcza z domowego IP, ale z serwerów GitHub Actions dostaje 403 (22.10.2026).

  - id: morele-daily
    name: Morele
    adapter: morele-daily
    tier: big
    url: https://www.morele.net/

  # /promotions zwraca 403, więc bierzemy okazję dnia ze strony głównej i "Hity miesiąca".
  - id: komputronik
    name: Komputronik
    adapter: komputronik
    tier: big
    urls:
      - https://www.komputronik.pl/
      - https://www.komputronik.pl/promocje/hity-miesiaca

  - id: empik
    name: Empik
    adapter: empik
    tier: big
    urls:
      - https://www.empik.com/okazje/produkty
      - https://www.empik.com/black-friday

  # Pominięte (sprawdzone 22.10.2026), ich oferty i tak trafiają na Pepper:
  # - Media Expert: 403 dla botów.
  # - RTV Euro AGD: strony promocji 403, a produkty na stronie głównej ładuje dopiero JavaScript.
  # - Ceneo: przekierowuje na captchę.

